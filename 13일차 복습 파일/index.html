<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bestsellers section</title>
    <link rel="stylesheet" href="normal.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 시멘틱 구조 -->
    <header>상단바</header>
    <main></main>
        <section class="bestsellers-section">
            <!-- ul-nav / 섹션 안 상단 부분 -->
            <div class="ul-nav">
                <div class="section-title">Bestsellers</div>
                <div class="view-all">View All</div>
            </div>

            <!-- amp-swiper / 섹션 안 하단 부분 -->
            <div class="amp-swiper">
                <div class="best-product-list best-product-list01">
                    <div class="best-img-box">
                        <img src="#" alt="향수 이미지">
                    </div>
                    <!-- p태그:문단 태그 -->
                    <!-- p태그 > a태그 -->
                    <p class="best-discount-title">
                        <a href="#">Niacinamide 10% + Zinc 1%</a> 
                    </p>
                    <p class="best-discount-subhead">
                        <a href="#">Oil Control, Brightens, Smooths</a> 
                    </p>
                    <div class="best-price-capacity">
                        <!-- div안에서 박스가 2개(가격,용량) 이므로 a태그도 2개 -->
                         <a class="best-price" href="#">₩8700 KRW</a>
                         <a class="best-capacity" href="#">
                            <span class="best-capacity-30ml">30ml</span>
                            <span class="best-capacity-60ml">60ml</span>
                         </a>
                    </div>
                    <button type="button" class="best-pro-btn">Add to Cart</button>
                </div>
                <div class="best-product-list best-product-list02"></div>
                <div class="best-product-list best-product-list03"></div>
                <div class="best-product-list best-product-list04"></div>
                                                
        </section>

    <footer>하단바</footer>
</body>
</html>
