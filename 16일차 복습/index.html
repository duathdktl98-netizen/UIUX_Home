<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>리스트 태그</title>
    <link rel="stylesheet" href="normal.css">
    <link rel="stylesheet" href="ul-li.css">
</head>
<body>
    <h1>ul태그와 ol태그
        <h2>ul태그</h2>
        <p>ul과 li는 html레이아웃 구현시 적극 활용</p>
        <ul>
            <li>English</li>
            <li>login</li>
            <li>wishlist</li>
            <li>bag</li>
        </ul>
        
        <h2>ol태그</h2>
        <p>ol과 ol자식 li는 블로그, 뉴스, 공지사항 등 순서가 중요한 구조에만 활용</p>
        <ol>
            <li>라면 봉지를 뜯는다.</li>
            <li>면과 스프를 분리한다.</li>
            <li>냄비에 물을 넣는다.</li>
            <li>냄비에 면과 스프를 넣는다.</li>
        </ol>
    </h1>
</body>
</html>
